# @package _global_
#
# Trains a model to predict damped Newton steps.
#
# Targets are built on the fly rather than read from the dataset: a frozen
# reference potential supplies the forces F = -grad E and, through a second
# backward pass, the damped Hessian-vector product (H + lambda I) p. Driving
# the two together makes the predicted step p solve the damped Newton system
# without ever forming or inverting a Hessian. The damping lambda is learned
# alongside the step, regularised towards zero.
#
# The reference model is mandatory and machine-specific, so pass it on the
# command line:
#
#   spktrain experiment=newton_step_training_horm_hvp \
#       task.ref_model_path=/path/to/runs/<run>/best_model

defaults:
  - override /model: nnp
  - override /data: custom

run.path: runs

globals:
  cutoff: 5.
  lr: 1e-3
  energy_key: energy
  forces_key: forces
  newton_step_key: newton_step
  damping_factor_key: damping_factor
  damped_hvp_key: damped_hvp
  ref_forces_key: ref_forces
  distance_unit: Ang
  energy_unit: kcal/mol

data:
  distance_unit: ${globals.distance_unit}
  property_units:
    energy: ${globals.energy_unit}
    forces: ${globals.energy_unit}/${globals.distance_unit}
  transforms:
    - _target_: schnetpack.transform.CachedNeighborList
      cache_path: ${run.work_dir}/cache
      cache_workdir: ${tmpdir:}/cache
      keep_cache: False
      neighbor_list:
        _target_: schnetpack.transform.MatScipyNeighborList
        cutoff: ${globals.cutoff}
    - _target_: schnetpack.transform.CastTo32
  test_transforms:
    - _target_: schnetpack.transform.MatScipyNeighborList
      cutoff: ${globals.cutoff}
    - _target_: schnetpack.transform.CastTo32

model:
  output_modules:
    - _target_: schnetpack.atomistic.NewtonStep
      newton_step_key: ${globals.newton_step_key}
      n_in: ${model.representation.n_atom_basis}
      n_hidden: 60
    - _target_: schnetpack.atomistic.DampingFactor
      output_key: ${globals.damping_factor_key}
      n_in: ${model.representation.n_atom_basis}
      positivity: abs
  postprocessors:
    - _target_: schnetpack.transform.CastTo64

task:
  _target_: schnetpack.task.AtomisticTaskSurrogate
  ref_model_path: ???
  optimizer_cls: torch.optim.AdamW
  optimizer_args:
    lr: ${globals.lr}
    weight_decay: 0.01
  outputs:
    # the damped Newton system, (H + lambda I) p = F; the loss below is its residual
    - _target_: schnetpack.task.ModelOutput
      name: ${globals.damped_hvp_key}
      target_property: ${globals.ref_forces_key}
      loss_fn:
        _target_: torch.nn.MSELoss
      metrics:
        mae:
          _target_: torchmetrics.regression.MeanAbsoluteError
        mse:
          _target_: torchmetrics.regression.MeanSquaredError
      loss_weight: 1.00
    # keep the damping as small as the system allows (target is identically zero)
    - _target_: schnetpack.task.ModelOutput
      name: ${globals.damping_factor_key}
      target_property: target_damping_factor
      loss_fn:
        _target_: torch.nn.MSELoss
      metrics:
        mae:
          _target_: torchmetrics.regression.MeanAbsoluteError
        mse:
          _target_: torchmetrics.regression.MeanSquaredError
      loss_weight: 0.00001
    # not trained on (weight 0), logged to watch whether the predicted step
    # actually points downhill
    - _target_: schnetpack.task.ModelOutput
      name: ${globals.newton_step_key}
      target_property: ${globals.ref_forces_key}
      loss_fn:
        _target_: schnetpack.train.loss.DescendingLoss
      metrics:
        ascent_loss:
          _target_: schnetpack.train.metrics.IsDescendingMetric
          clamp_at_zero: True
        mean_ascent:
          _target_: schnetpack.train.metrics.IsDescendingMetric
          clamp_at_zero: False
      loss_weight: 0.0
