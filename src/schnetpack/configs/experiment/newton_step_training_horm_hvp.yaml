# @package _global_
#
# Trains a model to predict damped Newton steps.
#
# Targets are built on the fly rather than read from the dataset: a frozen
# reference potential, held by the training task, supplies the forces
# F = -grad E and, through a second backward pass through them, the damped
# Hessian-vector product (H + lambda I) p. Driving the two together
# makes the predicted step p solve the damped Newton system without ever
# forming or inverting a Hessian. The damping lambda is learned alongside the
# step, regularised towards zero.
#
# The reference model is mandatory and machine-specific, so pass it on the
# command line:
#
#   spktrain experiment=newton_step_training_horm_hvp \
#       globals.ref_model_path=/path/to/runs/<run>/best_model

defaults:
  - override /model: nnp
  - override /data: custom

globals:
  cutoff: 5.
  lr: 1e-3
  ref_model_path: ???
  energy_key: energy
  forces_key: forces
  newton_step_key: newton_step
  damping_factor_key: damping_factor
  damped_hvp_key: damped_hvp
  ref_forces_key: ref_forces
  distance_unit: Ang
  energy_unit: kcal/mol

data:
  dataset:
    distance_unit: ${globals.distance_unit}
    # targets are generated on the fly from the reference model, so nothing
    # has to be read off the database
    load_properties: []
    transforms:
      - _target_: schnetpack.transform.CachedNeighborList
        cache_path: ${run.work_dir}/cache
        cache_workdir: ${tmpdir:}/cache
        keep_cache: False
        neighbor_list:
          _target_: schnetpack.transform.MatScipyNeighborList
          cutoff: ${globals.cutoff}
      - _target_: schnetpack.transform.CastTo32
    test_transforms:
      - _target_: schnetpack.transform.MatScipyNeighborList
        cutoff: ${globals.cutoff}
      - _target_: schnetpack.transform.CastTo32

model:
  output_modules:
    - _target_: schnetpack.atomistic.NewtonStep
      newton_step_key: ${globals.newton_step_key}
      n_in: ${model.representation.n_atom_basis}
      n_hidden: 60
    - _target_: schnetpack.atomistic.DampingFactor
      output_key: ${globals.damping_factor_key}
      n_in: ${model.representation.n_atom_basis}
      positivity: abs
  postprocessors:
    - _target_: schnetpack.transform.CastTo64

task:
  _target_: schnetpack.train.NewtonSurrogateTask
  ref_model_path: ${globals.ref_model_path}
  ref_model_format: auto
  ref_model_force_key: ${globals.forces_key}
  newton_step_key: ${globals.newton_step_key}
  damping_factor_key: ${globals.damping_factor_key}
  ref_force_key: ${globals.ref_forces_key}
  damped_hvp_key: ${globals.damped_hvp_key}
  optimizer_cls: torch.optim.AdamW
  optimizer_args:
    lr: ${globals.lr}
    weight_decay: 0.01
  outputs:
    # the damped Newton system, (H + lambda I) p = F; the loss below is its
    # residual. Both sides are built by the task, hence target_source: prediction.
    - _target_: schnetpack.task.ModelOutput
      name: ${globals.damped_hvp_key}
      target_property: ${globals.ref_forces_key}
      target_source: prediction
      loss_fn:
        _target_: torch.nn.MSELoss
      metrics:
        mae:
          _target_: torchmetrics.regression.MeanAbsoluteError
        mse:
          _target_: torchmetrics.regression.MeanSquaredError
      loss_weight: 1.00
    # keep the damping as small as the system allows; nothing to regress
    # against, so this is a penalty on the output itself
    - _target_: schnetpack.task.UnsupervisedModelOutput
      name: ${globals.damping_factor_key}
      loss_fn:
        _target_: schnetpack.train.loss.MeanSquaredMagnitude
      metrics:
        mean:
          _target_: torchmetrics.aggregation.MeanMetric
      loss_weight: 0.00001
    # not trained on, logged to watch whether the predicted step actually
    # points downhill
    - _target_: schnetpack.task.ModelOutput
      name: ${globals.newton_step_key}
      target_property: ${globals.ref_forces_key}
      target_source: prediction
      metrics:
        ascent_loss:
          _target_: schnetpack.train.metrics.IsDescendingMetric
          clamp_at_zero: True
        mean_ascent:
          _target_: schnetpack.train.metrics.IsDescendingMetric
          clamp_at_zero: False
